<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub { fill: #59636e; font-size: 12px; }
    .step { fill: #0969da; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    .arrow { stroke: #8c959f; stroke-width: 2; fill: none; }
    .head { fill: #8c959f; }
    .lane { fill: #f6f8fa; stroke: #d0d7de; }
    .label { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .note { fill: #59636e; font-size: 12px; }
    .door { fill: #d0d7de; }
    .open { fill: #1a7f37; }
    .closed { fill: #8c959f; }
    .gurney { fill: #0969da; }
    .cart { fill: #9a6700; }
    .track { stroke: #0969da; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
    .trackc { stroke: #9a6700; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
    .ok { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .no { fill: #59636e; font-size: 12px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card, .lane { fill: #161b22; stroke: #30363d; }
      .title, .label { fill: #e6edf3; }
      .sub, .note, .no { fill: #9198a1; }
      .step, .gurney { fill: #4493f8; }
      .track { stroke: #4493f8; }
      .arrow { stroke: #6e7681; } .head { fill: #6e7681; }
      .door { fill: #30363d; }
      .open, .ok { fill: #3fb950; }
      .closed { fill: #6e7681; }
      .cart { fill: #d29922; } .trackc { stroke: #d29922; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="400" rx="12"/>

  <!-- pipeline -->
  <g>
    <rect class="card" x="20" y="24" width="168" height="112" rx="10"/>
    <text class="step" x="36" y="48">1 · SEE</text>
    <text class="title" x="36" y="72">Camera above door</text>
    <text class="sub" x="36" y="94">corridor view, 640 px</text>
    <text class="sub" x="36" y="112" style="font-size:11px">no frames saved by default</text>

    <rect class="card" x="208" y="24" width="168" height="112" rx="10"/>
    <text class="step" x="224" y="48">2 · DETECT</text>
    <text class="title" x="224" y="72">YOLO26s</text>
    <text class="sub" x="224" y="94">transport: stretcher,</text>
    <text class="sub" x="224" y="112">wheelchair, bed · cart</text>

    <rect class="card" x="396" y="24" width="168" height="112" rx="10"/>
    <text class="step" x="412" y="48">3 · TRACK</text>
    <text class="title" x="412" y="72">BoT-SORT + Kalman</text>
    <text class="sub" x="412" y="94">speed and heading</text>
    <text class="sub" x="412" y="112">in real seconds</text>

    <rect class="card" x="584" y="24" width="168" height="112" rx="10"/>
    <text class="step" x="600" y="48">4 · DECIDE</text>
    <text class="title" x="600" y="72">Open in time?</text>
    <text class="sub" x="600" y="94">arrival ≤ opening time</text>
    <text class="sub" x="600" y="112">+ margin · class vote</text>

    <rect class="card" x="772" y="24" width="168" height="112" rx="10"/>
    <text class="step" x="788" y="48">5 · ACT</text>
    <text class="title" x="788" y="72">Relay → door</text>
    <text class="sub" x="788" y="94">activation input only</text>
    <text class="sub" x="788" y="112">watchdog releases it</text>

    <path class="arrow" d="M190,80 L205,80" marker-end="url(#a)"/>
    <path class="arrow" d="M378,80 L393,80" marker-end="url(#a)"/>
    <path class="arrow" d="M566,80 L581,80" marker-end="url(#a)"/>
    <path class="arrow" d="M754,80 L769,80" marker-end="url(#a)"/>
  </g>

  <!-- lane 1: stretcher approaching -->
  <rect class="lane" x="20" y="160" width="920" height="68" rx="10"/>
  <text class="label" x="36" y="190">Stretcher approaching</text>
  <text class="note" x="36" y="210">opens before it arrives</text>
  <path class="track" d="M300,194 L760,194" marker-end="url(#a)"/>
  <rect class="gurney" x="300" y="184" width="52" height="20" rx="4"/>
  <rect class="gurney" x="470" y="184" width="52" height="20" rx="4" opacity="0.55"/>
  <rect class="gurney" x="640" y="184" width="52" height="20" rx="4" opacity="0.3"/>
  <rect class="open" x="800" y="170" width="6" height="48" rx="2"/>
  <rect class="open" x="836" y="170" width="6" height="48" rx="2"/>
  <text class="ok" x="856" y="199">OPEN</text>

  <!-- lane 2: cart approaching -->
  <rect class="lane" x="20" y="240" width="920" height="68" rx="10"/>
  <text class="label" x="36" y="270">Supply cart approaching</text>
  <text class="note" x="36" y="290">recognised, not a transport</text>
  <path class="trackc" d="M300,274 L760,274" marker-end="url(#a)"/>
  <rect class="cart" x="300" y="262" width="34" height="24" rx="4"/>
  <rect class="cart" x="470" y="262" width="34" height="24" rx="4" opacity="0.55"/>
  <rect class="cart" x="640" y="262" width="34" height="24" rx="4" opacity="0.3"/>
  <rect class="closed" x="800" y="250" width="42" height="48" rx="2"/>
  <text class="no" x="856" y="279">STAYS SHUT</text>

  <!-- lane 3: passing / parked -->
  <rect class="lane" x="20" y="320" width="920" height="68" rx="10"/>
  <text class="label" x="36" y="350">Stretcher passing by or parked</text>
  <text class="note" x="36" y="370">no motion toward the door</text>
  <path class="track" d="M560,344 L560,376" marker-end="url(#a)"/>
  <rect class="gurney" x="534" y="330" width="52" height="16" rx="4" opacity="0.55"/>
  <rect class="gurney" x="640" y="352" width="52" height="20" rx="4"/>
  <rect class="closed" x="800" y="330" width="42" height="48" rx="2"/>
  <text class="no" x="856" y="359">STAYS SHUT</text>
</svg>
